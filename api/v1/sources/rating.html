<!-- KLIC 사이트의 HTML 데모: Rating -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-rating" data-klic-component="rating">
<fieldset class="x-rating">
<legend>사용 경험 평가</legend>
<label>
<input type="radio" name="klic-example-choice" value="1"  data-choice>
<span >★<span class="sr-only">1점</span>
</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="2" checked data-choice>
<span >★<span class="sr-only">2점</span>
</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="3"  data-choice>
<span >★<span class="sr-only">3점</span>
</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="4"  data-choice>
<span >★<span class="sr-only">4점</span>
</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="5"  data-choice>
<span >★<span class="sr-only">5점</span>
</span>
</label>
</fieldset>
<p class="x-hint" data-choice-result>선택: 2</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
