<!-- KLIC 사이트의 HTML 데모: Pagination -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-pagination" data-klic-component="pagination">
<ul class="x-page-items" data-page-items>
<li>디자인 시스템</li>
<li>브랜드 리뉴얼</li>
</ul>
<nav class="x-button-row" aria-label="프로젝트 페이지" data-page="1">
<button type="button" class="btn secondary sm" data-cmp-action="page-prev" disabled aria-label="이전 페이지">‹</button>
<button type="button" class="btn secondary sm" data-cmp-action="page" data-page-number="1" aria-current="page">1</button>
<button type="button" class="btn secondary sm" data-cmp-action="page" data-page-number="2" >2</button>
<button type="button" class="btn secondary sm" data-cmp-action="page" data-page-number="3" >3</button>
<button type="button" class="btn secondary sm" data-cmp-action="page-next" aria-label="다음 페이지">›</button>
</nav>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
