<!-- KLIC 사이트의 HTML 데모: Popover -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="overlay-demo">
<div class="popover-anchor">
<button class="btn secondary" data-action="popover" aria-controls="klic-example-popover" aria-expanded="false">
<i data-lucide="sliders-horizontal">
</i> 프로젝트 옵션 <i data-lucide="chevron-down">
</i>
</button>
<div class="popover-menu" popover="auto" id="klic-example-popover">
<button data-action="popover-choice" data-choice="프로젝트 이름 변경">
<i data-lucide="pencil">
</i> 이름 변경</button>
<button data-action="popover-choice" data-choice="링크 복사">
<i data-lucide="copy">
</i> 링크 복사</button>
<button data-action="popover-choice" data-choice="보관하기">
<i data-lucide="archive">
</i> 보관하기</button>
</div>
</div>
<span>클릭해서 옵션을 열어보세요.</span>
</div>

<style>

  --klic-component-button-size-default-height: 2rem;

}
.btn {
  min-height: var(--klic-component-button-size-default-height);

  color: white;

}
</style>
