<!-- KLIC 사이트의 HTML 데모: Resizable -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-resizable" data-klic-component="resizable">
<div class="x-resize" data-resize-box>
<strong>폭을 바꿔보세요.</strong>
<p>텍스트는 영역 안에서 자연스럽게 줄바꿈합니다.</p>
</div>
<label class="x-label" for="klic-example-resize">작업 영역 폭</label>
<input id="klic-example-resize" type="range" min="140" max="280" value="240" data-resize>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
