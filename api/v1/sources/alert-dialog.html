<!-- KLIC 사이트의 HTML 데모: Alert Dialog -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-alert-dialog" data-klic-component="alert-dialog">
<button type="button" class="btn secondary sm" data-cmp-action="open-dialog" >보관 전 확인</button>
<dialog class="x-confirm">
<h3>프로젝트를 보관할까요?</h3>
<p>목록에서 숨기는 동작을 시연합니다.<br>실제 프로젝트는 변경하지 않습니다.</p>
<form method="dialog">
<button class="btn secondary sm" value="cancel" autofocus>취소</button>
<button class="btn sm" value="confirm">보관 확인</button>
</form>
</dialog>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
