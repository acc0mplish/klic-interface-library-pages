<!-- KLIC 사이트의 HTML 데모: Carousel -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-carousel" data-klic-component="carousel">
<div class="x-carousel" data-carousel="0">
<figure data-slide >
<img src="./block-runtime/catalog/course-02.webp" alt="데이터 분석 대시보드" width="640" height="400" loading="lazy" >
<figcaption>인터페이스 설계</figcaption>
</figure>
<figure data-slide hidden>
<img src="./block-runtime/catalog/course-03.webp" alt="모바일 인터페이스 디자인" width="640" height="400" loading="lazy" >
<figcaption>제품 디자인</figcaption>
</figure>
<figure data-slide hidden>
<img src="./block-runtime/catalog/course-05.webp" alt="프로토타이핑 작업" width="640" height="400" loading="lazy" >
<figcaption>팀 협업</figcaption>
</figure>
<div class="x-carousel-tools">
<button type="button" class="btn secondary sm" data-cmp-action="carousel-prev" aria-label="이전 이미지">‹</button>
<span data-carousel-count aria-live="polite">1 / 3</span>
<button type="button" class="btn secondary sm" data-cmp-action="carousel-next" aria-label="다음 이미지">›</button>
</div>
</div>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
