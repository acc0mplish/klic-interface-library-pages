<!-- KLIC 사이트의 HTML 데모: Transfer -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-transfer" data-klic-component="transfer">
<div class="x-transfer">
<fieldset data-transfer-list="left">
<legend>전체 팀</legend>
<label>
<input type="checkbox" value="디자인"> 디자인</label>
<label>
<input type="checkbox" value="개발"> 개발</label>
<label>
<input type="checkbox" value="운영"> 운영</label>
</fieldset>
<div>
<button type="button" class="btn secondary sm" data-cmp-action="transfer" data-direction="right" aria-label="선택 팀 추가">→</button>
<button type="button" class="btn secondary sm" data-cmp-action="transfer" data-direction="left" aria-label="선택 팀 제외">←</button>
</div>
<fieldset data-transfer-list="right">
<legend>참여 팀</legend>
<label>
<input type="checkbox" value="기획"> 기획</label>
</fieldset>
</div>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
