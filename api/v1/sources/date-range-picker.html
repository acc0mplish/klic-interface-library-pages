<!-- KLIC 사이트의 HTML 데모: Date Range Picker -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-date-range-picker" data-klic-component="date-range-picker">
<div class="x-columns">
<div class="x-field">
<label class="x-label" for="klic-example-from">시작일</label>
<input class="demo-input" id="klic-example-from" type="date" value="2026-10-24" data-date-start>
</div>
<div class="x-field">
<label class="x-label" for="klic-example-to">종료일</label>
<input class="demo-input" id="klic-example-to" type="date" value="2026-10-30" min="2026-10-24" data-date-end>
</div>
</div>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>

  --klic-component-button-size-default-height: 2rem;

  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
