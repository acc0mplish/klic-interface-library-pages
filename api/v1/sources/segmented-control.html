<!-- KLIC 사이트의 HTML 데모: Segmented Control -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-segmented-control" data-klic-component="segmented-control">
<fieldset class="x-segment">
<legend>일정 보기</legend>
<label>
<input type="radio" name="klic-example-choice" value="일"  data-choice>
<span >일</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="주" checked data-choice>
<span >주</span>
</label>
<label>
<input type="radio" name="klic-example-choice" value="월"  data-choice>
<span >월</span>
</label>
</fieldset>
<p class="x-hint" data-choice-result>선택: 주</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>

     확장 컴포넌트: ./component-expansion.mjs + ./component-expansion.css
