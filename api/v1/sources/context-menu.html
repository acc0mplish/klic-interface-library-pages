<!-- KLIC 사이트의 HTML 데모: Context Menu -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-context-menu" data-klic-component="context-menu">
<div class="x-context-target" data-context-target="klic-example-popup">
<i data-lucide="file-text" aria-hidden="true">
</i> 프로젝트 제안서.pdf</div>
<button type="button" class="btn secondary sm" popovertarget="klic-example-popup">파일 메뉴 <i data-lucide="chevron-down" aria-hidden="true">
</i>
</button>
<div class="x-popover" popover="auto" id="klic-example-popup">
<button type="button" class="btn secondary sm" data-cmp-action="menu-choice" data-name="이름 변경">이름 변경</button>
<button type="button" class="btn secondary sm" data-cmp-action="menu-choice" data-name="복제하기">복제하기</button>
<button type="button" class="btn secondary sm" data-cmp-action="menu-choice" data-name="링크 확인">링크 확인</button>
</div>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
