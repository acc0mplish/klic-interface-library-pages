<div class="x-demo xc-form" data-klic-component="form">
<form data-component-form>

<input class="demo-input" id="klic-example-name" name="project" required maxlength="60" placeholder="프로젝트 이름">
</div>
<div class="x-field">

</div>

}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
