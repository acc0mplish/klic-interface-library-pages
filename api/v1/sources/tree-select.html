<!-- KLIC 사이트의 HTML 데모: Tree Select -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-tree-select" data-klic-component="tree-select">
<fieldset class="x-options">
<legend>저장할 폴더</legend>
<details open>
<summary>프로젝트</summary>
<div class="x-tree-indent">
<label>
<input type="radio" name="klic-example-folder" value="디자인" checked data-choice> 디자인</label>
<label>
<input type="radio" name="klic-example-folder" value="개발"  data-choice> 개발</label>
<label>
<input type="radio" name="klic-example-folder" value="운영"  data-choice> 운영</label>
</div>
</details>
</fieldset>
<p class="x-hint" data-choice-result>선택: 디자인</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>

<!-- 완전한 스타일: ./styles.css + ./brand.css
     확장 컴포넌트: ./component-expansion.mjs + ./component-expansion.css
     확장 동작: ./component-interactions.mjs의 initComponentInteractions()
     아이콘: ./lucide.min.js (ISC)
     상호작용: ./app.js
     이 코드는 별도 npm 패키지가 아닌 이 사이트의 예제입니다. -->
