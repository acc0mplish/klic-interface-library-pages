<!-- KLIC 사이트의 HTML 데모: Field -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<form class="input-demo-stack field-demo" novalidate>
<div>
<label class="demo-label" for="klic-example-email">이메일 주소 <span class="field-required" aria-hidden="true">*</span>
</label>
<input class="demo-input" id="klic-example-email" type="email" name="email" value="hello@klic" required aria-invalid="true" aria-describedby="klic-example-error">
<p class="demo-error" id="klic-example-error">
<i data-lucide="circle-alert">
</i>
<span>올바른 이메일 주소를 입력해주세요.</span>
</p>
</div>
<button class="btn secondary sm" type="submit">이메일 확인 <i data-lucide="arrow-right">
</i>
</button>
</form>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
