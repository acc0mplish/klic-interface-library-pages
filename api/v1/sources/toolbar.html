<!-- KLIC 사이트의 HTML 데모: Toolbar -->
<!-- 전체 데모는 브라우저의 native API와 app.js를 사용합니다. -->
<div class="x-demo xc-toolbar" data-klic-component="toolbar">
<div class="x-stack" role="group" aria-label="문서 작업 도구">
<div class="x-button-row" role="group" aria-label="문서 명령">
<button type="button" class="btn secondary sm" data-cmp-action="menu-choice" data-name="새 문서">
<i data-lucide="file-plus" aria-hidden="true">
</i> 새 문서</button>
<button type="button" class="btn secondary sm" data-cmp-action="menu-choice" data-name="문서 내보내기">
<i data-lucide="download" aria-hidden="true">
</i> 내보내기</button>
</div>
<hr style="width:100%">
<div class="x-button-row" role="group" aria-label="보기 옵션">
<button type="button" class="btn secondary sm" data-cmp-action="toggle" aria-pressed="true">
<i data-lucide="message-square" aria-hidden="true">
</i> 주석 표시</button>
</div>
</div>
<p class="x-hint">문서 명령과 보기 옵션을 구분한 작업 도구 모음</p>
<p class="x-status" data-cmp-status role="status" aria-live="polite">
</p>
</div>

<style>
/* 기준 프로필 A의 높이: 2rem (root 16px일 때 32px) */
:root {
  --klic-component-button-size-default-height: 2rem;
  --klic-component-input-size-default-height: 2rem;
  --klic-semantic-color-accent: #245fc2;
}
.btn {
  min-height: var(--klic-component-button-size-default-height);
  padding: .35rem .7rem;
  border-radius: .3125rem;
  border: 1px solid transparent;
  background: var(--klic-semantic-color-accent);
  color: white;
  font: inherit;
}
</style>
