<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KLIC 가상 인물 프로필 검토</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f7fb;color:#152337;font:14px system-ui,sans-serif}h1{font-size:22px}p{line-height:1.6}#portraits{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px}figure{margin:0;background:white;border:1px solid #dbe4ef;border-radius:12px;padding:14px;text-align:center}.photo{display:block;width:96px;height:96px;margin:auto;border-radius:50%;background-repeat:no-repeat}figcaption{margin-top:10px;font-weight:600}small{display:block;color:#526278;margin-top:4px}</style><h1>KLIC 가상 인물 프로필</h1><p>AI로 생성한 가상 성인 인물 129명. 각 이름은 모든 예시 화면에서 같은 셀을 사용합니다.</p><div id="portraits"></div><script type="module">import{PORTRAIT_PEOPLE,getPortrait}from'./registry.mjs';const root=document.querySelector('#portraits');for(const name of Object.keys(PORTRAIT_PEOPLE).sort()){const p=getPortrait(name,'./');const f=document.createElement('figure');const photo=document.createElement('span');photo.className='photo';photo.setAttribute('role','img');photo.setAttribute('aria-label',name+' · AI 생성 가상 인물 프로필');photo.style.backgroundImage='url('+p.url+')';photo.style.backgroundSize=p.backgroundSize;photo.style.backgroundPosition=p.backgroundPosition;const c=document.createElement('figcaption');c.textContent=name;const s=document.createElement('small');s.textContent=p.atlas.toUpperCase()+' · '+(p.row+1)+'행 '+(p.column+1)+'열';f.append(photo,c,s);root.append(f)}</script></html>
