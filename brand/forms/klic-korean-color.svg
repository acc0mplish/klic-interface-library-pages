<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-labelledby="korean-color-title korean-color-desc"><title id="korean-color-title">KLIC · Korean name · color</title><desc id="korean-color-desc">Original KLiC SVG contours; arrangement based on klic.co.kr/logo. Korean name is editable Paperlogy text, not the original lettering outline.</desc><defs xmlns="http://www.w3.org/2000/svg">
