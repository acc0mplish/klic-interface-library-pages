      }

      .korean-color-st2 {
        fill: #1d2088;
      }
    </style>
    <linearGradient id="korean-color-accent" x1="194.91" y1="-1200.62" x2="217.12" y2="-1200.62" gradientTransform="translate(0 -1139.78) scale(1 -1)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00479d" />
      <stop offset="1" stop-color="#7dcdf4" />
    </linearGradient>
